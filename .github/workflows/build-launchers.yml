name: Build and Release PokiNative

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for this build, digits and dots only (example: 0.4.6.3)"
        required: true
        type: string

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the version format
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Version must be digits and dots, like 0.4.6.3" >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check that game content is not in the repository
        run: python tools/check_content.py
      - name: Install test dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Check launcher package rules
        continue-on-error: true
        run: python tools/check_launcher.py
      - name: Extraction tests
        run: python tests/test_extract.py
      - name: RomFS tests
        run: python tests/test_romfs.py
      - name: Phase report tests
        run: python tests/test_phases.py
      - name: Install lifter build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm ninja-build
      - name: Lifter differential tests
        run: python tests/lifter/test_lifter.py

  notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate the change list
        shell: bash
        run: |
          set -euo pipefail
          prev="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          {
            echo "# PokiNative ${VERSION}"
            echo
            echo "## Changes"
            echo
            if [ -n "$prev" ]; then
              git log "${prev}..HEAD" --no-merges --pretty='- %s (%h)'
            else
              git log --no-merges --pretty='- %s (%h)' -n 50
            fi
          } > release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build-windows:
    needs: validate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        shell: bash
        run: |
          set -euo pipefail
          for f in launcher/KarPurLauncher.csproj launcher-linux/KarPurLauncher.Linux.csproj; do
            sed -i -E "s#<Version>[^<]*</Version>#<Version>${VERSION}</Version>#" "$f"
            grep -n "<Version>" "$f"
          done
          if [ -f VERSION ]; then echo "$VERSION" > VERSION; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: make mingw-w64-ucrt-x86_64-gcc
      - name: Build hactool
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: python tools/build_hactool.py
      - name: Build shader translator
        run: python tools/build_xlate.py
      - name: Build Windows launcher
        run: python tools/make_launcher.py
      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: launcher-windows
          if-no-files-found: error
          path: |
            dist/KarPur-Launcher-Windows-x86_x64.exe
            dist/KarPur-Launcher-Windows-x86_x64.exe.sha256
            dist/recomplauncher.json
            dist/PokiNative-*-Windows-x64.zip

  build-linux:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        shell: bash
        run: |
          set -euo pipefail
          for f in launcher/KarPurLauncher.csproj launcher-linux/KarPurLauncher.Linux.csproj; do
            sed -i -E "s#<Version>[^<]*</Version>#<Version>${VERSION}</Version>#" "$f"
            grep -n "<Version>" "$f"
          done
          if [ -f VERSION ]; then echo "$VERSION" > VERSION; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install AppImage and SDL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake clang lld llvm ninja-build pkg-config squashfs-tools \
            libasound2-dev libdbus-1-dev libdecor-0-dev libdrm-dev libegl1-mesa-dev \
            libgbm-dev libibus-1.0-dev libopus-dev libpipewire-0.3-dev libpulse-dev \
            libsamplerate0-dev libudev-dev libvulkan-dev libvpx-dev libwayland-dev \
            libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev \
            libxinerama-dev
