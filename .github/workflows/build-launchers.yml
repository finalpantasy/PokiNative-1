name: Build and Release PokiNative

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for this build, digits and dots only (example: 0.4.7)"
        required: true
        type: string

permissions:
  contents: read

env:
  # Tag push: the tag name. Manual run: the version you typed.
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the version format
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Version must be digits and dots, like 0.4.7 (got: $VERSION)" >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check that game content is not in the repository
        run: python tools/check_content.py
      - name: Install test dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Check launcher package rules
        continue-on-error: true
        run: python tools/check_launcher.py
      - name: Extraction tests
        run: python tests/test_extract.py
      - name: RomFS tests
        run: python tests/test_romfs.py
      - name: Phase report tests
        run: python tests/test_phases.py
      - name: Install lifter build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm ninja-build
      - name: Lifter differential tests
        run: python tests/lifter/test_lifter.py

  notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate the change list
        shell: bash
        run: |
          set -euo pipefail
          prev="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          {
            echo "# PokiNative ${VERSION}"
            echo
            echo "## Changes"
            echo
            if [ -n "$prev" ]; then
              git log "${prev}..${GITHUB_SHA}" --no-merges --pretty='- %s (%h)'
            else
              git log "${GITHUB_SHA}" --no-merges --pretty='- %s (%h)' -n 50
            fi
          } > release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build-windows:
    needs: validate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        shell: bash
        run: |
          set -euo pipefail
          for f in launcher/KarPurLauncher.csproj launcher-linux/KarPurLauncher.Linux.csproj; do
            sed -i -E "s#<Version>[^<]*</Version>#<Version>${VERSION}</Version>#" "$f"
            grep -n "<Version>" "$f"
          done
          if [ -f VERSION ]; then echo "$VERSION" > VERSION; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: make mingw-w64-ucrt-x86_64-gcc
      - name: Build hactool
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: python
