name: Build and Push (Linux & Windows)

on:
  push:
    tags:
      - 'v*' # Triggers on tags starting with 'v'

permissions:
  contents: write # Required if uploading assets to GitHub Releases
  packages: write # Required if pushing to GitHub Packages/Container Registry

jobs:
  build-and-push:
    strategy:
      fail-fast: false # Ensures Windows still finishes even if Linux fails (and vice versa)
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build application
        run: |
          # Runs in bash on Linux and pwsh (PowerShell) on Windows by default
          echo "Building ${{ github.ref_name }} on ${{ matrix.os }}..."
          # Add your cross-platform build command here (e.g., cargo build --release, go build, dotnet publish)

      - name: Push / Upload Release Asset
        # Example: Attaching OS-specific builds to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            path/to/your/output-*
