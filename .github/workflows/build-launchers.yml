name: Build and Release PokiNative

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:   # manual test run: builds only, no release

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check that game content is not in the repository
        run: python tools/check_content.py
      - name: Install test dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Check launcher package rules
        continue-on-error: true
        run: python tools/check_launcher.py
      - name: Extraction tests
        run: python tests/test_extract.py
      - name: RomFS tests
        run: python tests/test_romfs.py
      - name: Phase report tests
        run: python tests/test_phases.py
      - name: Install lifter build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm ninja-build
      - name: Lifter differential tests
        run: python tests/lifter/test_lifter.py

  notes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate the change list
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          {
            echo "# PokiNative ${tag}"
            echo
            echo "## Changes"
            echo
            if [ -n "$prev" ]; then
              git log "${prev}..${tag}" --no-merges --pretty='- %s (%h)' 2>/dev/null \
                || git log "${prev}..HEAD" --no-merges --pretty='- %s (%h)'
            else
              git log --no-merges --pretty='- %s (%h)' -n 50
            fi
          } > release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build-windows:
    needs: validate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Set version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          for f in launcher/KarPurLauncher.csproj launcher-linux/KarPurLauncher.Linux.csproj; do
            sed -i -E "s#<Version>[^<]*</Version>#<Version>${VERSION}</Version>#" "$f"
            grep -n "<Version>" "$f"
          done
          if [ -f VERSION ]; then echo "$VERSION" > VERSION; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: make mingw-w64-ucrt-x86_64-gcc
      - name: Build hactool
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: python tools/build_hactool.py
      - name: Build shader translator
        run: python tools/build_xlate.py
      - name: Build Windows launcher
        run: python tools/make_launcher.py
      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: launcher-windows
          if-no-files-found: error
          path: |
            dist/KarPur-Launcher-Windows-x86_x64.exe
            dist/KarPur-Launcher-Windows-x86_x64.exe.sha256
            dist/recomplauncher.json
            dist/PokiNative-*-Windows-x64.zip

  build-linux:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          for f in launcher/KarPurLauncher.csproj launcher-linux/KarPurLauncher.Linux.csproj; do
            sed -i -E "s#<Version>[^<]*</Version>#<Version>${VERSION}</Version>#" "$f"
            grep -n "<Version>" "$f"
          done
          if [ -f VERSION ]; then echo "$VERSION" > VERSION; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install AppImage and SDL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake clang lld llvm ninja-build pkg-config squashfs-tools \
            libasound2-dev libdbus-1-dev libdecor-0-dev libdrm-dev libegl1-mesa-dev \
            libgbm-dev libibus-1.0-dev libopus-dev libpipewire-0.3-dev libpulse-dev \
            libsamplerate0-dev libudev-dev libvulkan-dev libvpx-dev libwayland-dev \
            libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev \
            libxinerama-dev libxkbcommon-dev libxrandr-dev libxss-dev \
            libxxf86vm-dev libxtst-dev libzstd-dev libclang-rt-18-dev
      - name: Build Linux AppImage
        run: python tools/make_appimage.py
      - name: Upload Linux release files
        uses: actions/upload-artifact@v4
        with:
          name: launcher-linux
          if-no-files-found: error
          path: |
            dist/linux/PokiNative-*-linux-x86_64.AppImage
            dist/linux/PokiNative-*-linux-x86_64.AppImage.sha256

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [notes, build-windows, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download build files and notes
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          mv release-assets/release-notes.md ./release-notes.md

          # A hand-written docs/releases/<tag>.md wins over the generated list
          if [ -f "docs/releases/$tag.md" ]; then
            notes_file="docs/releases/$tag.md"
          else
            notes_file="release-notes.md"
          fi

          ls -l release-assets

          draft_state="$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [ "$draft_state" = "false" ]; then
            echo "Refusing to modify an already published release: $tag" >&2
            exit 1
          elif [ "$draft_state" = "true" ]; then
            gh release edit "$tag" --notes-file "$notes_file"
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* --draft \
              --verify-tag --title "PokiNative $tag" --notes-file "$notes_file"
          fi

  save-version-bump:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish-release
    runs-on: ubuntu-24.04
    continue-on-error: true   # a failure here never affects the release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
      - name: Commit the new version to testing
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          for f in launcher/KarPurLauncher.csproj launcher-linux/KarPurLauncher.Linux.csproj; do
            sed -i -E "s#<Version>[^<]*</Version>#<Version>${VERSION}</Version>#" "$f"
          done
          if [ -f VERSION ]; then echo "$VERSION" > VERSION; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A launcher launcher-linux
          if [ -f VERSION ]; then git add VERSION; fi
          git diff --cached --quiet || git commit -m "Set version to ${VERSION}"
          git push origin HEAD:testing
